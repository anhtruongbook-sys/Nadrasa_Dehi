name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.2
          name: "Neta Light & Poker v1.0.2 (Android APK)"
          body: |
            ## Ứng dụng Di Động Cài Đặt Trực Tiếp (APK) v1.0.2
            - **Khắc phục triệt để lỗi hiển thị ảnh**: Loại bỏ hoàn toàn thuộc tính crossorigin gây chặn ảnh trên WebView Android.
            - **Hiển thị hình ảnh tức thì**: Tích hợp Base64 nội bộ giúp quân bài hiện lên ngay lập tức 0ms không bao giờ bị vỡ.
            - **100% Lưu ảnh trực tiếp vào Thư viện ảnh (Bộ sưu tập)**: Tự động lưu ảnh trải bài vào Album điện thoại mà không bị lỗi canvas.
            - **100% Hoạt động Offline độc lập**: Đóng gói nội bộ toàn bộ tài nguyên (HTML, CSS, JS, âm thanh, hình ảnh thẻ bài Neta & Poker).
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false
