name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.4.4
          name: "Neta Light & Huyền Học v1.4.4 (Tarot Encyclopedia V2 & Reflective Journal V2)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.4.4
            - **Bách Khoa Toàn Thư 78 Lá Bài Chuyên Sâu (Tarot Encyclopedia V2)**:
              + **Phân loại đa tầng**: Lọc theo bộ lá (Ẩn chính, Cốc, Tiền, Kiếm, Gậy) và phân cấp (Hoàng gia - Court cards, Lá số - Pips 1-10).
              + **Hộp thoại chi tiết lá bài tương tác 3D**: Cho phép xoay lật 180 độ xem chiều Xuôi (Upright) và chiều Ngược (Reversed) trực quan.
              + **Bảng thuộc tính học thuật**: Tích hợp tương ứng Chiêm tinh / Hành tinh, Số học huyền bí (Numerology) và phân tích biểu tượng học Rider-Waite-Smith (RWS Symbolism) chuẩn mực.
            - **Nhật Ký Trải Bài & Phản Tư Cá Nhân (Tarot Reflective Journal V2)**:
              + **Ghi chú phản tư cá nhân (Personal Reflection Note)**: Cho phép bổ sung, chỉnh sửa cảm nhận và ghi chép thực tế sau mỗi lần xem bài.
              + **Đánh giá độ ứng nghiệm (Accuracy Rating)**: Hệ thống chấm sao 1-5 sao kèm trạng thái chiêm nghiệm (Đang chiêm nghiệm, Đã ứng nghiệm, Bài học sâu sắc).
              + **Bảng thống kê năng lượng tâm thức**: Tổng hợp số lần trải bài, phân tích bộ lá áp đảo và thống kê top các lá bài xuất hiện nhiều nhất.
              + **Sao lưu & Phục hồi JSON**: Hỗ trợ xuất và nhập dữ liệu nhật ký dạng JSON cục bộ an toàn.
            - **Giao Diện Bàn Bài Dải Quạt Ribbon 78 Lá (Interactive Fanned Ribbon Deck)**:
              + 78 lá bài dải quạt xếp lớp mượt mà với hiệu ứng chạm nhô cao và vòng hào quang vàng kim.
              + Rút bài trực giác từng bước cho từng vị trí Quá khứ - Hiện tại - Tương lai.
              + Bộ tổng hợp âm thanh Web Audio API và rung xúc giác ngoại tuyến 100%.
            - **Động Cơ Luận Giải Chuyên Sâu Cốt Tủy & Mạch Truyện Biện Chứng (Tarot Core Heuristic Engine)**:
              + Thuật toán Lá Bài Cốt Tủy (The Quintessence Card) tìm bài học linh hồn cốt lõi.
              + Bộ tạo mạch truyện biện chứng nhân quả liên hoàn kết hợp ma trận Golden Dawn Elemental Dignities.
              + Nhận diện các tổ hợp cổ mẫu đặc thù (Mẫu Hoàng gia, Đơn sắc, Cặp bài chuyển hóa).
            - **Tối Ưu Hóa Giao Diện Báo Cáo Phân Tầng Chuyên Sâu**:
              + Trình bày trang trọng: *Lá Bài Cốt Tủy $\rightarrow$ Tổng Luận Mạch Truyện Biện Chứng $\rightarrow$ Mẫu Hình Cổ Mẫu $\rightarrow$ Phân Tích Vĩ Mô & Ma Trận Nguyên Tố $\rightarrow$ Chi Tiết Từng Lá $\rightarrow$ Lời Khuyên Hành Động*.
              + Cuộn cảm ứng di động mượt mà 60 FPS, hỗ trợ giao diện Sáng & Tối hoàn hảo.
              + Bổ sung cơ chế `overflow-y: auto !important`, `-webkit-overflow-scrolling: touch` và `touch-action: pan-y` cho container giao diện Tarot.
              + Cho phép vuốt cuộn mượt mà 60 FPS từ trên xuống dưới và từ dưới lên trên, không còn bị khựng hay kẹt màn hình.
            - **Tối Ưu Hóa Bố Cục Bàn Bài Tarot Trên Mobile**:
              + Tinh chỉnh khoảng cách padding, đưa thanh tab `[Trải Bài] [Bách Khoa] [Nhật Ký]` lên cùng 1 hàng cuộn ngang gọn gàng.
              + Cả 3 lá bài trải ra hiển thị vừa vặn, trọn vẹn và cân đối trên màn hình điện thoại mà không bị cắt nửa chừng.
              + Bổ sung tính năng tự động cuộn mượt mà (`smooth scrollIntoView`) tới bàn bài và báo cáo khi bốc bài.
              + Tích hợp đầy đủ CSDL tri thức 78 lá bài (22 Major Arcana + 56 Minor Arcana: Cốc, Tiền, Kiếm, Gậy).
              + Áp dụng Thuật toán Tương tác Nguyên tố Cổ điển **Golden Dawn Elemental Dignities**: Đánh giá định lượng tương sinh (+1.5), đồng dạng (+1.0), tương khắc (-1.0) và trung tính (+0.5).
              + **Phân tích Định lượng Vĩ mô (Macro Scan)**: Tỷ lệ Ẩn chính (Định mệnh vs Ý chí tự do), Tỷ lệ Chiều bài (Xuôi / Ngược), Phân bổ 4 Nguyên tố (Lửa, Nước, Khí, Đất) và Dòng chảy năng lượng tổng thể.
            - **Trải Nghiệm Bàn Bài 3D & Lật Bài Chân Thực (Interactive 3D Flip)**:
              + Bốc bài ngẫu nhiên theo xác suất tự nhiên (75% xuôi, 25% ngược).
              + Hiệu ứng lật bài 3D mượt mà xoay ngang `rotateY(180deg)` giữ nguyên chiều bài RWS, tự động định vị thẻ ngược.
              + Đa dạng kiểu trải bài: 3 lá Quá khứ - Hiện tại - Tương lai, Vấn đề & Giải pháp, Mối quan hệ, Quyết định A/B, và 1 lá Daily Card.
            - **Bách Khoa Toàn Thư 78 Lá Bài (Tarot Encyclopedia)**:
              + Tra cứu toàn bộ 78 lá bài với bộ lọc Ẩn chính, Cốc, Tiền, Kiếm, Gậy và tìm kiếm thông minh.
              + Popup chi tiết: Ảnh HD, từ khóa Xuôi/Ngược, ý nghĩa Tổng quan, Công việc, Tình cảm và Lời khuyên hành động.
            - **Nhật Ký Trải Bài Cục Bộ (Tarot Journal)**:
              + Lưu trữ chiêm nghiệm bảo mật 100% trên thiết bị, xem lại lịch sử chi tiết mọi lúc không cần mạng.
            - **Hoàn toàn Ngoại tuyến 100% Offline (Zero-AI, Zero-API, Zero-Cost)**: Khởi động tức thì, bảo mật tuyệt đối.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

