name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.1
          name: "Neta Light & Huyền Học v1.3.1 (Đại Trùng Tu Lá Số Tử Vi Hoàng Gia & Hệ Thống Điều Khiển Hợp Nhất)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.1 (Bản Đại Trùng Tu Toàn Diện)
            - **Đại Trùng Tu Tuyệt Phẩm Lá Số Tử Vi Đẩu Số 4x4 (Imperial Masterpiece)**:
              + **Thiên Bàn Hoàng Gia**: Khung viền thếp vàng cổ điển 2 lớp, hoa văn Thái Cực Âm Dương ẩn chìm tinh tế, bố cục 2 cột đối xứng chia ngăn hoàng kim (Thời gian sinh đối xứng Bản Mệnh, Cục số, Cung Mệnh, Thân cư, Chủ Mệnh & Chủ Thân chuẩn Thái Thứ Lang).
              + **Phân tầng Màu sắc Ngũ Hành Đậm Chất Sơn Mài**: Sao Tử Vi (Thổ - Vàng kim), Thất Sát (Kim - Trắng ngọc), Liêm Trinh (Hỏa - Đỏ ruby), Thiên Đồng (Thủy - Lam sapphire), Thiên Cơ (Mộc - Lục bảo) phân cấp độ sáng miếu vượng (M, V, Đ, H) rõ rệt.
              + **Thẻ Tóm Lược Master Overview 4 Ô Ngọc Bích**: Đương số, Bản Mệnh, Cục số, Thân cư hiển thị nổi bật, không tràn màn hình.
              + **Hệ thống Cung Chức & Phụ Tinh Cát / Sát 2 Cột**: Cung Mệnh viền hoàng kim, huy hiệu THÂN, TRIỆT, TUẦN chạm nổi, phụ tinh chia 2 cột Cát tinh (xanh) - Sát tinh (đỏ) đối xứng hoàn hảo.
            - **Hệ Thống Khung Điều Khiển Hợp Nhất 3 Tầng Chuẩn Mực (Unified Control Card)**:
              + **Phân vùng chức năng 3 tầng rõ ràng cho cả 4 module** (Kỳ Môn, Bát Tự, Tử Vi, Lịch):
                * Tầng 1: Chọn Lịch (Dương / Âm) + Nhập ngày tháng năm + Phím tắt chọn nhanh thập niên `⚡Năm` + Lịch hệ thống.
                * Tầng 2: Chọn Can Chi giờ + Giờ số : Phút + Tuỳ chọn phụ (Giới tính Nam/Nữ hoặc Bước nhảy 2h Kỳ Môn).
                * Tầng 3: Hành động chính: Nút `⚡ Giờ thực` bên trái (chống bấm nhầm), Chế độ xem ở giữa, Nút lập lá số nổi bật bên phải.
              + **Xử lý triệt để lỗi tràn dòng & kẹt nút**: Sửa nút bước giờ Kỳ Môn `[ ◀ 2h ] [ 2h ▶ ]`, thanh Lịch 2 tầng không tràn ngang.
              + **Bấm chọn ngày trong lịch tháng tự động chuyển sang Lịch Ngày Bloc chi tiết**.
            - **Hoạt động Ngoại tuyến 100% Offline**: Tốc độ 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

