name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.2.0
          name: "Neta Light & Huyền Học v1.2.0 (Tử Vi, Bát Tự, Kỳ Môn, Lịch Vạn Niên)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.2.0 (Bản Nâng Cấp Toàn Diện)
            - **Bổ sung 4 Phân Hệ Huyền Học Kinh Điển Chuyên Sâu**:
              + **Tử Vi Đẩu Số**: 12 Cung sao chuẩn Nam Phái (Thái Thứ Lang), 2 chế độ xem (Bàn 4x4 truyền thống & Thẻ bài 12 Cung), xem chi tiết hội chiếu Tam Phương Tứ Chính.
              + **Bát Tự Manh Phái & Hà Lạc**: Tứ Trụ, Thập Thần, Thần Sát, Đại Vận 10 bước, Lưu Niên 10 năm, phân tích Ngũ Hành vượng suy theo Tiết Khí.
              + **Kỳ Môn Độn Giáp**: Bàn 9 Cung Lạc Thư, Tam Kỳ Lục Nghi, Bát Môn, Cửu Tinh, Bát Thần, bước nhảy giờ thực tế.
              + **Lịch Âm Dương Vạn Niên**: Lịch Tháng đối chiếu Âm - Dương, Hoàng Đạo/Hắc Đạo, Thập Nhị Trực, 28 Tú, Tiết Khí, chạm ô ngày tự động mở tờ Lịch Ngày chi tiết.
            - **Giao Diện Siêu Tinh Gọn 24px & Nền Sáng Chuẩn WCAG AAA**:
              + Rút gọn thanh điều khiển đầu trang xuống 24px, loại bỏ icon thừa, giải phóng tối đa diện tích hiển thị lá số.
              + Tương phản cao trên cả nền Sáng và Tối, nét chữ mực đen `#111827`, ngọc lục bảo `#047857`, hổ phách `#78350f`.
            - **Lưu Ảnh Chụp Trực Tiếp 1 Chạm (Không Popup)**: Lưu trực tiếp ảnh chụp lá số chất lượng cao về máy.
            - **Hoạt động Ngoại tuyến 100% Offline**: Độc lập hoàn toàn, không cần kết nối mạng.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

