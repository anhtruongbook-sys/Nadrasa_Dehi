name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.7
          name: "Neta Light & Huyền Học v1.3.7 (Tái Cấu Trúc Toàn Diện Thiên Bàn Tử Vi)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.7
            - **Tái Cấu Trúc Toàn Diện Ô Giữa (Thiên Bàn Tử Vi)**:
              + Loại bỏ hoàn toàn vách ngăn dọc chia đôi thô cứng khiến chữ bị dồn ép và đè chồng lên nhau.
              + Thiết kế lại layout phân tầng ngang (Full-width Horizontal Rows):
                * Tiêu đề & Đương số: Font chữ lớn, sắc nét, trang trọng.
                * Khối Thời Gian Sinh (Dương lịch, Âm lịch, Giờ sinh, Tuổi mụ): Trải rộng 100% bề ngang ô giữa, khoảng cách thoáng đãng, tuyệt đối không va chạm chữ.
                * Khối Bản Mệnh & Cục Số: Bản Mệnh Nạp Âm nổi bật trong thẻ viền hổ phách sang trọng, Cục số và Cung Mệnh/Thân phân bổ cân đối.
                * Khối Chủ Mệnh & Chủ Thân: Căn đều chân Thiên Bàn tinh tế.
            - **Khắc Phục Lỗi Nút Tràn Ra Ngoài Khung (Lịch Âm Dương)**:
              + Cân bằng thanh điều khiển 2 tầng, nút `🚀 Xem` nằm gọn gàng bên trong thẻ.
            - **Khắc Phục Cắt Chữ & Đè Huy Hiệu Tử Vi**:
              + Phụ tinh co giãn tự nhiên, không cắt tên sao dài (*Thiếu Dương*, *Thanh Long*...).
              + Huy hiệu `THÂN`, `TRIỆT`, `TUẦN` bố trí song song không chồng chéo.
            - **Giao Diện Phẳng Hiện Đại (Pure Flat UI)**: Độ tương phản cao, tối ưu cho cả chế độ Sáng (Light) và Tối (Dark).
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

