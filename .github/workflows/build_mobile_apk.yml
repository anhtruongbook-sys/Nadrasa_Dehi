name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.3
          name: "Neta Light & Huyền Học v1.3.3 (Chuyển Đổi Giao Diện Phẳng Hoàn Toàn & Tương Phản Tối Đa)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.3
            - **Chuyển Đổi Giao Diện Phẳng Hoàn Toàn (Pure Flat Design)**:
              + Loại bỏ 100% bóng đổ 3D (box-shadow/text-shadow), dải màu chuyển (radial/linear gradients) và viền giả nổi; chuyển sang ngôn ngữ thiết kế phẳng hiện đại, tinh gọn và thanh thoát.
              + Khung viền đơn sắc phẳng, sắc nét (Crisp 1px / 1.5px Hairline Borders) phân tách rõ ràng từng cung chức và dải tổng quan.
            - **Khắc Phục Triệt Để Độ Tương Phản Trong Chế Độ Sáng (Light Theme Max Contrast)**:
              + **Tiêu đề Cung chức**: Hiển thị màu Đen Tuyền (`#0f172a`), font đậm 900, chấm dứt hoàn toàn hiện tượng chữ trắng chìm trên nền trắng.
              + **Thiên Bàn Trung Tâm**: Toàn bộ nhãn thông tin (`Dương`, `Âm`, `Giờ`, `Mụ`, `Mệnh`, `Cục`, `Cung`, `Thân`) hiển thị màu xám đậm (`#475569`) và giá trị màu Đen Tuyền/Hổ Phách (`#0f172a` / `#b45309`), nhìn rõ ràng 100%.
              + **Phụ Tinh & Đáy Cung**: Cát tinh xanh lục đậm (`#15803d`), Sát tinh đỏ thắm (`#b91c1c`), Can Chi và Đại hạn đậm nét, tuyệt đối không bị mờ nhạt.
            - **Đồng Bộ Giao Diện Phẳng Tối (Dark Theme Flat UI)**:
              + Tối ưu nền phẳng Slate-900 / Slate-800 (`#0f172a`, `#1e293b`), giữ độ tương phản cao và dịu mắt.
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: Trải nghiệm 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

