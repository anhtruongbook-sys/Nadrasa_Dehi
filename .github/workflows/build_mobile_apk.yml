name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.0
          name: "Neta Light & Poker v1.1.0 (Giao Diện Zen Tối Giản & Chuẩn Công Thái Học)"
          body: |
            ## Ứng dụng Di Động Neta Light & Poker v1.1.0 (Bản Phát Hành Hiện Đại & Tối Giản)
            - **Header Siêu Mỏng (~42px) & Dropdown Kính Mờ Tinh Tế**:
              + Tích hợp bộ chọn bộ bài ngay tại tiêu đề Header (`NETA LIGHT ▾` / `BÀI TÂY POKER ▾`) với menu kính mờ (glassmorphism) sang trọng.
              + Lược bỏ hàng Tab cố định 44px, giải phóng hoàn toàn không gian trên đỉnh màn hình.
            - **Tiện Dụng 1 Chạm với 4 Nút Monoline Ghost**:
              + Giữ trọn vẹn 100% 4 chức năng tiện ích (📸 Chụp ảnh, ☀️/🌙 Sáng/Tối, 🔕/🔔 Chuông, 📜 Tra cứu).
              + Tinh giản thị giác thành icon vector thanh mảnh, chạm phản hồi tức thì 0ms, không chiếm dụng không gian.
            - **Mở Rộng Không Gian Bàn Bài (Arena) +25-30%**:
              + Tận dụng tối đa diện tích chiều dọc vừa giải phóng, lá bài tự động co giãn to hơn, sắc nét và trang nghiêm hơn.
            - **Công Thái Học Tay Phải Tuyệt Đối Dưới Đáy**:
              + Nút `[➕ Rút tiếp]` to bản ở góc ngoài cùng bên phải — đúng tầm ngón cái tay phải.
              + Nút `[🔄 Thu bài]` ở góc ngoài cùng bên trái với hộp thoại xác nhận tinh tế, triệt tiêu nguy cơ bấm nhầm.
            - **Hoạt động Ngoại tuyến 100% Offline**: Độc lập hoàn toàn, không cần kết nối mạng.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

