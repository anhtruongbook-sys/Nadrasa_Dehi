name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.8
          name: "Neta Light & Huyền Học v1.3.8 (Tính Năng Năm Xem & An 9 Sao Lưu Hàng Năm)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.8
            - **Bổ Sung Tính Năng Chọn Năm Xem Hạn (Mặc định năm hiện tại 2026 - Bính Ngọ)**:
              + Bổ sung thanh điều khiển Năm xem siêu tốc: nút lùi/tiến năm `[ ◀ ] [ 2026 ] [ ▶ ]`, hiển thị Can Chi năm xem `(Bính Ngọ)` và nút `⚡ Năm nay`.
              + Tự động tính toán chính xác 100% Tuổi Mụ theo Năm Xem (ví dụ sinh năm 1979 xem năm 2026 $\rightarrow$ 48 tuổi, không còn bị mặc định 1 tuổi).
            - **An Đầy Đủ Bộ 9 Sao Lưu (Lưu Niên Tinh) Chuẩn Nam Phái Thái Thứ Lang**:
              + Tự động an 9 sao lưu trên 12 cung theo Can Chi của năm xem:
                * **Lưu Thái Tuế** (theo Địa Chi năm xem).
                * **Lưu Tang Môn** (cách Lưu Thái Tuế 2 cung chiều thuận).
                * **Lưu Bạch Hổ** (đối cung Lưu Tang Môn).
                * **Lưu Thiên Khốc, Lưu Thiên Hư** (khởi Ngọ tính nghịch/thuận).
                * **Lưu Lộc Tồn** (theo Thiên Can năm xem).
                * **Lưu Kình Dương, Lưu Đà La** (trước/sau Lưu Lộc Tồn 1 cung).
                * **Lưu Thiên Mã** (theo Tam Hợp Chi năm xem).
              + Đánh dấu cung Tiểu Hạn của năm xem với huy hiệu `[HẠN]` nổi bật.
              + Hiển thị nhãn Sao Lưu thanh lịch ngay trên chân cung, phân biệt rõ Cát / Hung.
            - **Tái Cấu Trúc Toàn Diện Ô Giữa (Thiên Bàn Tử Vi)**:
              + Layout phân tầng ngang toàn chiều rộng, hiển thị trang trọng: `Năm xem: 2026 (Bính Ngọ) • 48 tuổi`.
              + Loại bỏ triệt để tình trạng đè chữ hay cắt chữ.
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

