name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.4
          name: "Neta Light & Poker v1.0.4 (Android APK)"
          body: |
            ## Ứng dụng Di Động Cài Đặt Trực Tiếp (APK) v1.0.4
            - **Mặc định Tắt Âm Thanh Chuông**: Ứng dụng khởi động trong trạng thái hoàn toàn yên tĩnh và thiền tịnh. Người dùng có thể chủ động bấm biểu tượng 🔕 trên thanh tiêu đề để bật âm thanh 🔔 bất kỳ lúc nào.
            - **Phản hồi âm thanh tinh tế**: Khi bấm bật âm thanh, một tiếng chuông thiền tần số 432Hz sẽ ngân nhẹ để báo hiệu âm thanh đã sẵn sàng.
            - **Quy chuẩn Rút Bài Độc Bản (1 cây/lần)**: Tuân thủ quy định chuẩn xác, mỗi lần rút ngẫu nhiên đúng 1 cây duy nhất (áp dụng cho cả 2 bộ bài Neta Light & Poker Tây).
            - **Hộp thoại Xác Nhận Thu Bài Tinh Tế**: Bổ sung xác nhận trước khi thu dọn bài giúp chống bấm nhầm, thiết kế nhã nhặn, sang trọng với 2 lựa chọn [Giữ lại] và [Thu bài].
            - **Bảo toàn Hình ảnh Tuyệt đối**: Quân bài tải tức thì 0ms, không bao giờ bị vỡ ảnh trên WebView Android.
            - **Lưu Ảnh Trực Tiếp vào Album Máy**: Chụp và tải ảnh trải bài với chất lượng cao, sắc nét.
            - **Hoạt động Ngoại tuyến 100% Offline**: Độc lập hoàn toàn, không cần kết nối mạng.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false
