name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.2
          name: "Neta Light & Huyền Học v1.3.2 (Hoàn Thiện Không Gian & Bố Cục Lá Số Tử Vi Hoàng Gia)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.2
            - **Hoàn thiện Không gian & Bố cục Lá Số Tử Vi 4x4 (Zero Text Clipping)**:
              + **Thu gọn Thanh Master Overview thành Ruy-băng Thượng Hạng (Single Sleek Ribbon)**: Tiết kiệm ~40px chiều dọc, mở rộng không gian hiển thị cho toàn bộ 12 cung chức.
              + **Mở rộng Chiều cao Cung & Tỉ lệ Khung 4x4**: Tăng aspect-ratio lên 1 / 1.25, chiều cao tối thiểu 520px, giúp mỗi ô cung tăng gấp đôi không gian chứa chính tinh và phụ tinh.
              + **Chuẩn hoá Tiêu Đề Cung & Chống Tràn Dòng**: Tất cả 12 cung chức nằm gọn trên 1 dòng duy nhất kèm huy hiệu Thân, Triệt, Tuần sắc nét.
              + **Tinh Chỉnh Font Chữ & Giãn Cách Phụ Tinh (Secondary Stars)**: Font 0.42rem kèm kerning chuẩn mực giúp hiển thị đầy đủ tên các sao dài (Thiếu Dương, Tướng Quân, Nguyệt Đức, Thanh Long...) không còn bị cắt chữ `...`.
              + **Thiên Bàn Hoàng Gia Chuẩn Xác**: Ngày giờ âm dương, Mệnh, Cục, Cung, Thân, Chủ Mệnh, Chủ Thân hiển thị toàn văn nguyên bản 100%.
            - **Hệ Thống Khung Điều Khiển Hợp Nhất 3 Tầng Chuẩn Mực (Unified Control Card)**:
              + Nút `⚡ Giờ thực` tách biệt bên trái chống bấm nhầm sau khi đã nhập thông tin.
              + Nhập nhanh năm/thập niên bằng phím tắt `⚡ Năm`.
              + Tự động chuyển đổi mượt mà giữa Lịch Tháng và Lịch Ngày Bloc.
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: Trải nghiệm 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

