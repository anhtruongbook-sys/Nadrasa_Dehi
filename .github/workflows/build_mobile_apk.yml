name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.0
          name: "Neta Light & Huyền Học v1.3.0 (Bộ Chọn Ngày Giờ Siêu Tốc & Thập Niên 1940-2030)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.0 (Bản Nâng Cấp Bộ Chọn Ngày Giờ Siêu Tốc)
            - **Bộ Chọn Ngày Giờ Thông Minh & Bảng Thập Niên Siêu Tốc (Smart Picker & Decade Jumper)**:
              + **Nhập trực tiếp số tự nhảy ô**: Gõ 2 số ngày tự nhảy tháng, gõ 2 số tháng tự nhảy năm, phím Backspace lùi ô thông minh.
              + **Tự hoàn thiện năm 2 chữ số**: Gõ `79` -> `1979`, `65` -> `1965`, `05` -> `2005` mà không cần gõ đủ 4 số.
              + **Bảng chọn Thập niên & Năm 2 Chạm (`⚡Năm`)**: Chọn các năm từ 1940 đến 2030 chỉ với 2 lần chạm, thao tác siêu nhanh cho mọi độ tuổi.
              + **Chuyển đổi Lịch Hai Chiều (`☀️ Dương` <-> `🌙 Âm`)**: Cho phép nhập ngày sinh âm lịch và tự động chuyển đổi thiên văn chuẩn xác sang dương lịch.
              + **Đồng bộ Can Chi giờ <-> Giờ số (HH:MM)**: Tự động tính toán canh giờ Can Chi tương ứng.
              + **Bảo vệ nút Giờ Thực / Hôm Nay**: Tách biệt nút đặt lại để tránh bấm nhầm sau khi đã nhập ngày giờ cụ thể.
            - **4 Phân Hệ Huyền Học Hoàn Chỉnh**:
              + **Tử Vi Đẩu Số**: 12 Cung Nam Phái Thái Thứ Lang, 2 chế độ hiển thị (4x4 & Thẻ bài).
              + **Bát Tự Manh Phái**: Tứ Trụ, Thập Thần, Đại Vận, Lưu Niên.
              + **Kỳ Môn Độn Giáp**: 9 Cung Lạc Thư, Chân Thái Dương Thời, bước nhảy giờ thực.
              + **Lịch Âm Dương**: Lịch Tháng và Lịch Ngày Bloc chi tiết.
            - **Hoạt động Ngoại tuyến 100% Offline**: Không phụ thuộc internet.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

