name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.7.0
          name: "Neta Light & Huyền Học v1.7.0 (Sửa lỗi Tainted Canvas Chụp Ảnh Màn Hình, Cập Nhật 48 Lá Bài Neta HD & Ẩn Thanh Tìm Kiếm La Kinh)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.7.0
            - **Khắc phục Triệt Để Lỗi Chụp Ảnh Màn Hình (📷 Tainted Canvas Error) Cho Cả 2 Module Mới**:
              + **Tarot Rider-Waite**: Định tuyến container `#view-tarot`, nạp toàn bộ ảnh lá bài sang Base64 Data URL sạch via FileReader nội bộ, loại bỏ hoàn toàn lỗi `Tainted canvases may not be exported`. Tự động mở rộng toàn bộ bảng quẻ và luận giải chi tiết, ẩn thanh công cụ điều khiển để xuất ảnh báo cáo quẻ bài Retina sắc nét (`Tarot_RiderWaite_*.png`).
              + **La Kinh Vệ Tinh (Thước Lập Cực 36 Tầng)**: Tự động chuyển đổi các mảnh vệ tinh Google (không có CORS) sang tọa độ tương đương trên ArcGIS World Imagery (`server.arcgisonline.com`) có sẵn `Access-Control-Allow-Origin: *`, nạp sạch vào Base64 canvas. Bảo tồn đĩa La Kinh 36 tầng xuyên thấu, kim chỉ hướng, tâm nhà và bảng thông số phong thủy; gắn watermark khảo sát vệ tinh chuyên nghiệp (`LaKinh_VeTinh_*.png`).
              + **Cơ Chế Phục Hồi Tự Động 2 Lớp (Auto-Recovery Fallback)**: Tự động khử sạch ảnh không an toàn nếu có lỗi tainted canvas đột xuất, cam kết 100% không bao giờ ném lỗi đỏ ra màn hình.
            - **Cập Nhật 48 Quân Bài Neta Light & Mặt Lưng HD Sắc Nét 100%**:
              + Thay thế toàn bộ 48 lá bài cũ bằng ảnh chất lượng cao từ thư mục `Bai Neta` gốc.
              + Cập nhật mặt lưng bài mới sắc nét (`00 - Mặt sau.jpg` $\rightarrow$ `card_back.png`).
              + Tái tạo toàn bộ CSDL Base64 nội bộ `cards_base64_data.js` hoạt động độc lập 100% Offline.
            - **Tự Động Ẩn Thanh Tìm Kiếm La Kinh Sau Khi Chọn Địa Điểm**:
              + Khi chọn xong địa chỉ từ danh sách gợi ý hoặc chạm vào bản đồ, thanh tìm kiếm `#lakinh-search-bar-wrap` tự động thu gọn để trả lại toàn bộ không gian quan sát địa hình và mái nhà.
              + Bổ sung nút đóng `▲` (`#lakinh-search-bar-close`) và nút kích hoạt mở lại `🔍` (`#lakinh-btn-search`) trên thanh HUD trên cùng.
            - **Đại Tu Động Cơ Xuất PDF Luận Giải Tarot Trực Tiếp**:
              + Sửa lỗi canvas bị tainted khi tạo PDF bằng cơ chế pre-convert Data URL và fallback hai lớp chữ - hình chuẩn mực. Tự động lưu thẳng file PDF về máy qua NativeBridge không cần popup.
            - **Tích Hợp Toàn Diện Phân Hệ Phong Thủy Địa Lý - La Kinh Vệ Tinh (36 Tầng)**:
              + **Đồ họa Vector Đa Tầng Toán Học (36-Ring Luopan Vector SVG)**: Tích hợp trọn vẹn đĩa La Kinh 36 tầng vector độ phân giải cực cao (90 KB), hỗ trợ nhìn xuyên thấu với thanh trượt chỉnh độ mờ (5% - 100%) và kích thước (260px - 950px), đè phủ trực tiếp lên mái nhà và thửa đất trên ảnh vệ tinh mà không làm che khuất địa vật.
              + **Bản Đồ Viễn Thám Đa Lớp (Leaflet Multi-Layer WebGIS)**: Tích hợp ảnh vệ tinh Google Earth độ nét cao, Esri World Imagery và bản đồ đường phố OpenStreetMap; hỗ trợ phóng to chi tiết đến cấp công trình (Zoom 18-22).
              + **Thuật Toán Bù Góc Từ Thiên Thời Gian Thực (WMM 2025-2030)**: Tự động tính toán và hiệu chỉnh độ lệch giữa Bắc Từ Tính và Bắc Địa Lý theo tọa độ WGS-84 trên lãnh thổ Việt Nam, bảo đảm số đo la bàn thực địa trùng khớp với hướng Bắc Google Earth.
              + **Cảm Biến La Bàn Con Quay Hồi Chuyển & Bộ Lọc Thông Thấp (Low-Pass Filter)**: Làm mịn dao động la bàn với hệ số alpha = 0.18, chống hiện tượng rung lắc giật cục trên điện thoại di động; hỗ trợ nút Khóa Góc đo tức thì khi khảo sát thực địa.
              + **Trắc Địa Số DEM & Quét Cao Độ 3 Cấp Minh Đường Cục**: Tự động quét mô hình cao độ số địa hình theo 3 cấp bán kính (Tiểu Minh Đường 40m, Trung Minh Đường 350m, Đại Minh Đường 2000m) để tìm điểm trũng nhất (Thủy Khẩu / Tụ Thủy) và điểm cao nhất (Lai Long / Tọa Sơn).
              + **Tam Hợp Thủy Pháp Cổ Truyền**: Tự động định Tứ Đại Cục (Thủy Cục, Hỏa Cục, Kim Cục, Mộc Cục) từ phương vị Thủy Khẩu, xác định cung vị Trường Sinh, xuất đường dẫn liên kết mở trực tiếp tọa độ Thủy Khẩu trên Google Maps.
              + **Tinh Bàn Huyền Không Phi Tinh Vận 9 (2024 - 2043)**: Lập ma trận Lạc Thư 9 cung chuẩn xác với Tọa tinh, Hướng tinh và Vận tinh theo độ số thực tế của La Kinh.
              + **Công Cụ Vẽ Ranh Đất & Định Vị Tim Thửa Đất (Centroid Tool)**: Chấm các góc ranh đất để tính diện tích m² và trọng tâm hình học theo định lý Green, tự động đưa tâm bản đồ về chính giữa thửa đất.
              + **Quản Lý Hồ Sơ & Xuất Tệp KML Google Earth**: Lưu trữ lịch sử khảo sát trực tiếp trong bộ nhớ máy và tạo tệp KML GroundOverlay nạp vào Google Earth Pro.
            - **Đại Tu Toàn Diện Động Cơ Tạo File PDF Luận Giải (High-Fidelity PDF Engine Overhaul)**:
              + Khắc phục triệt để lỗi file PDF tải về bị trắng tinh (loại bỏ hoàn toàn cơ chế render lệch tọa độ `-9999px` cũ khiến thư viện chụp canvas trống).
              + Trực tiếp thu nhận và tối ưu hóa từ vùng hiển thị đồ họa thực tế (`#tarot-report-section`), bảo toàn trọn vẹn 100% hình ảnh lá bài Tarot độ phân giải cao (`150px x 255px`), các biểu tượng thần số học, hộp từ khóa và hộp lời khuyên viền ngọc lục bảo.
              + Cơ chế đồng bộ tải trước (Preload & Await Complete) 100% hình ảnh quân bài trước khi đóng gói PDF, xóa bỏ hiện tượng mất hình hoặc vỡ layout.
              + Tự động loại bỏ cụm nút bấm khỏi tệp PDF xuất ra, bổ sung tiêu đề banner hành chính trang trọng (`NETA LIGHT - BÁO CÁO LUẬN GIẢI TAROT CHUYÊN SÂU`) và chân trang xuất bản A4 chuẩn mực.
              + Cấu hình phân trang thông minh (`page-break-inside: avoid`), chống cắt ngang lá bài hay bảng biểu qua mép trang.
            - **Loại Bỏ Tính Năng Lưu File HTML Thô (Deprecate Raw HTML Export)**:
              + Xóa bỏ hoàn toàn nút `[📥 Tải File HTML]` ở cả phần kết quả luận giải và trong Sổ tay Nhật ký theo phản hồi người dùng.
              + Tái cấu trúc lưới 3 nút bấm công thái học: Nút `[📄 Tải File PDF]` màu xanh ngọc lục bảo nổi bật ở hàng 1 chiếm trọn 100% chiều rộng, hàng 2 gồm `[💾 Lưu Nhật Ký]` và `[📋 Sao Chép MD]` đối xứng 50% - 50%.
            - **Cố Định Lưới Bố Cục Thao Tác Quẻ Bài 100% Khớp Cạnh (Zero Layout Shift)**:
              + Khắc phục triệt để hiện tượng 3 nút thao tác `[⚡ Bốc Bài Tự Động]`, `[✨ Lật Bài]`, `[🔄 Trải Mới]` bị thò ra thụt vào, lệch mép so với ô nhập câu hỏi bên trên.
              + Hàng trên `[⚡ Bốc Bài Tự Động]` kéo giãn đủ 100% chiều rộng container, khớp chính xác từng pixel với ô nhập câu hỏi.
              + Hàng dưới chia lưới 2 cột đối xứng chuẩn xác 50% - 50% (`grid-template-columns: 1fr 1fr`, gap: 8px), mép ngoài bên trái và bên phải ăn khớp 100% với hàng trên.
              + Giữ cố định vĩnh viễn cả 3 nút trong cấu trúc DOM, hiển thị trạng thái mờ `disabled` (`opacity: 0.35`) khi chưa đủ điều kiện thay vì tự ý chèn/xóa động gây giật nảy màn hình.
              + Tinh gọn nhãn nút thành `[✨ Lật Bài]` và `[🔄 Trải Mới]` để hiển thị vừa vặn, sắc nét trên mọi kích cỡ màn hình di động mà không bao giờ bị cắt chữ hay hiện dấu ba chấm `...`.
            - **Tối Ưu Hóa Kích Thước & Khung Trưng Bày Lá Bài Nghệ Thuật (Large Card Artwork Showcase)**:
              + Nâng kích thước lá bài trong từng mục luận giải từ 90px lên **150px x 255px** (chuẩn tỷ lệ vàng 1:1.7 của Tarot RWS), xóa bỏ hoàn toàn hiện tượng lá bài bé tí lọt thỏm giữa khoảng trống bao la.
              + Đặt lá bài trong khung tranh nghệ thuật sang trọng (`border-radius: 12px`, viền mảnh sắc nét và đổ bóng êm dịu), tôn vinh trọn vẹn từng đường nét biểu tượng của lá bài.
              + Thiết kế lại huy hiệu trạng thái Thuận / Ngược thành thẻ Flat Pill bo tròn mềm mại (`border-radius: 9999px`) với màu xanh dương / đỏ ruby phẳng tinh tế.
              + Nâng kích thước Lá Bài Cốt Tủy (The Quintessence Card - Phần I) lên **105px x 178px** vương giả.
            - **Tối Ưu Hóa Bố Cục Phân Cấp Thị Giác (Enhanced Visual Hierarchy Layout)**:
              + Đưa vị trí quẻ bài (`QUÁ KHỨ / CĂN NGUYÊN GỐC RỄ`, `HIỆN TẠI / THỬ THÁCH CỐT LÕI`) và Tên lá bài lên phần đầu trang trọng, tiếp nối là khung tranh lá bài lớn căn giữa, rồi đến hộp từ khóa cốt lõi, phần luận giải biện chứng căn lề hai bên, và hộp lời khuyên hành động viền xanh ngọc lục bảo.
            - **Thiết Kế Lại Toàn Bộ Nút Bấm Chuẩn Triết Lý Phẳng (Modern Flat Design Philosophy)**:
              + Loại bỏ 100% các dải chuyển màu gradient bóng bẩy, viền 3D nổi thô thiển.
              + Đồng bộ các nút bấm phẳng theo chuẩn Material Design 3 / Flat UI: Nút chính Indigo `#4f46e5`, nút PDF Emerald `#059669`, nút thứ cấp Flat Slate `#f1f5f9` / `#1e2030`, nút lọc Bách khoa dạng Chip phẳng bo tròn.
              + Độ nảy bấm vi mô phẳng tự nhiên (`transform: scale(0.97)`), khoảng cách đệm chuẩn tay chạm di động.
            - **Xóa Bỏ 100% Hộp Thoại Alert Cổ Lỗ Sĩ (Eliminate Native Alert Modals)**:
              + Loại bỏ hoàn toàn hộp thoại OS trắng thô cứng `The page at "file://" says: Đã lưu...` làm gián đoạn trải nghiệm người dùng.
              + Thay thế bằng cơ chế phản hồi vi mô tức thì ngay trên chính nút bấm (**In-Place Button Micro-Interaction**):
                * Bấm `[💾 Lưu Nhật Ký]` $\rightarrow$ Đổi ngay sang `✅ Đã Lưu` (hiệu ứng Gradient ngọc lục bảo rực rỡ), khóa nút tự động chống lưu trùng lặp.
                * Bấm `[📄 Tải File PDF]` $\rightarrow$ Đổi sang `⏳ Đang Tạo...` $\rightarrow$ `✅ Đã Lưu PDF`.
                * Bấm `[📥 Tải File HTML]` $\rightarrow$ Đổi sang `✅ Đã Lưu HTML`.
                * Bấm `[📋 Sao Chép MD]` $\rightarrow$ Đổi sang `✅ Đã Sao Chép`.
              + Tích hợp thanh thông báo nổi hình viên thuốc (**Floating Pill Toast / Snackbar**) bo tròn mềm mại (`border-radius: 9999px`, viền ánh kim, kính mờ `backdrop-filter: blur(12px)`), tự động trượt lên và biến mất êm dịu sau 2.4 giây mà không hề chặn thao tác đọc bài hay vuốt chạm của người dùng.
            - **Lưu File Vật Lý Trực Tiếp Vào Thư Mục Tải Về (`Download/NetaLight`) Của Điện Thoại**:
              + Bổ sung cầu nối MethodChannel `saveFileToDownloads` trong tầng Android Native Kotlin kết hợp Scoped Storage (`MediaStore.Downloads.EXTERNAL_CONTENT_URI` trên Android 10+ và `Environment.DIRECTORY_DOWNLOADS` trên Android 9-).
              + Xử lý định tuyến `NativeBridge` trong Flutter `_handleJavaScriptMessage` cho hành vi tải tệp `saveFile`.
              + Tự động giải mã dữ liệu Base64 từ engine đồ họa `html2pdf.js` và lưu trực tiếp tệp PDF chuẩn in ấn A4 (`Luan_Giai_Tarot_Neta_*.pdf`), tệp HTML độc lập (`Bao_Cao_Tarot_Neta_*.html`) và tệp sao lưu dữ liệu Nhật ký JSON (`NetaLight_Tarot_Journal_*.json`) vào máy.
              + Người dùng mở xem hoặc chia sẻ tệp ngay trong ứng dụng Quản lý Tệp (Files / Downloads) của điện thoại mà không bị chặn hay mất tệp.
            - **Căn Lề Đều Hai Bên (Justify Alignment) Toàn Bộ Nội Dung Luận Giải**:
              + Áp dụng quy chuẩn in ấn `text-align: justify !important; text-justify: inter-word !important;` cho toàn bộ văn bản luận giải trong ứng dụng: Mạch truyện biện chứng, Luận giải vị trí từng lá bài, Ý nghĩa biểu tượng học, Bài học linh hồn cốt tủy và Kế hoạch hành động.
              + Hai mép lề chữ thẳng đều, đẹp mắt và trang trọng như một ấn bản sách huyền học chuyên sâu.
            - **Tải File Trực Tiếp Một Chạm (Loại Bỏ Hoàn Toàn Popup)**:
              + Bỏ hẳn cửa sổ popup xem trước gây xung đột hoặc không phản hồi trên thiết bị di động.
              + Bố cục cụm 4 nút hành động lưới 2x2 gọn gàng, vừa vặn 100% trên màn hình hẹp: `[💾 Lưu Nhật Ký] [📄 Tải File PDF] [📥 Tải File HTML] [📋 Sao Chép MD]`.
              + Tích hợp thư viện đồ họa độc lập `html2pdf.js` nội bộ, tạo và tải trực tiếp tệp `Luan_Giai_Tarot_Neta.pdf` về thư mục Tải xuống của điện thoại chỉ với 1 chạm.
              + Tối ưu hóa tải tệp HTML báo cáo độc lập với cơ chế giữ liên kết Blob 45 giây, hoạt động ổn định trên Chrome Android và các trình duyệt di động.
            - **Tính Năng Xuất & Lưu File PDF Luận Giải Chi Tiết (High-Fidelity PDF Export)**:
              + Bổ sung nút bấm `📄 Lưu / Xuất File PDF` trực tiếp ở cuối mỗi bản luận giải và trong từng bản ghi Nhật Ký.
              + Khổ giấy chuẩn A4 với đầy đủ đồ họa quân bài HD trực quan, hiển thị rõ nét lá thuận / lá ngược (xoay 180°), thông tin nguyên tố và tỷ lệ vĩ mô.
              + Bản xem trước tương tác (Interactive Preview Modal) tích hợp 2 tùy chọn: `🖨️ Lưu Dưới Dạng PDF (Save as PDF)` kích hoạt trình in hệ thống và `💾 Tải Bản HTML Báo Cáo` tự đứng độc lập 100% offline.
              + Quy tắc CSS in ấn phần cứng (@media print) bảo toàn trọn vẹn màu sắc, hình ảnh và loại bỏ hoàn toàn các thanh điều hướng giao diện web.
            - **Khắc phục triệt để độ tương phản nút chức năng ở chế độ Sáng (Light Theme)**:
              + Nút `📋 Sao Chép Markdown` và các nút phụ được chuyển sang nền trắng viền xám tro với chữ đen than đậm `#0f172a`, xóa bỏ hoàn toàn hiện tượng chữ mờ/trùng màu nền.
              + Nút `📄 Lưu / Xuất File PDF` mang sắc xanh ngọc lục bảo chuyển sắc (Emerald Gradient `#059669` $\rightarrow$ `#10b981`), tạo sự phân tầng thị giác rõ ràng và thu hút.
            - **Khắc phục triệt để tương phản giao diện Sáng (Light Theme Contrast)**:
              + Sửa lỗi màu chữ nhạt/trùng màu nền ở các huy hiệu mẫu hình (Pattern Badges) chuyển sang màu đỏ rượu vang đậm (#831843) trên nền hồng nhạt (#fce7f3) có viền rõ nét.
              + Chuẩn hóa độ tương phản toàn diện cho khối Luận giải cốt tủy, Mạch truyện biện chứng, Chi tiết từng lá bài và Thước đo vĩ mô đạt chuẩn WCAG AAA.
            - **Chuẩn hóa hiển thị Markdown (Loại bỏ ký tự thô `**`)**:
              + Tích hợp bộ chuyển đổi Markdown sang HTML nội tuyến (`<strong>`, `<em>`), hiển thị tên lá bài in đậm và lời khuyên in nghiêng mượt mà, không còn hiện dấu sao `**`.
            - **Tối ưu hóa Bố cục 3 Nút Điều Hướng Trên Mobile**:
              + Tinh gọn nhãn hiển thị thành `🔮 Trải Bài`, `📖 Bách Khoa`, `📔 Nhật Ký` với tỷ lệ linh hoạt `flex: 1 1 0` cân đối 33.3%, đảm bảo vừa vặn 100% trên màn hình hẹp (360px - 390px) mà không bị che khuất hay tràn mép.
            - **Cấu hình Chế độ Rung Xúc giác (Haptic Feedback)**:
              + Mặc định TẮT (False) để tiết kiệm pin và tránh làm phiền.
              + Bổ sung công tắc bật/tắt `📳 Rung (Haptic)` trong bảng điều khiển trải bài, người dùng chủ động bật khi cần.
            - **Giao Diện Bàn Bài Dải Quạt Ribbon 78 Lá (Interactive Fanned Ribbon Deck)**:
              + 78 lá bài dải quạt xếp lớp mượt mà với hiệu ứng chạm nhô cao và vòng hào quang vàng kim.
              + Rút bài trực giác từng bước cho từng vị trí Quá khứ - Hiện tại - Tương lai.
              + Bộ tổng hợp âm thanh Web Audio API và rung xúc giác ngoại tuyến 100%.
            - **Động Cơ Luận Giải Chuyên Sâu Cốt Tủy & Mạch Truyện Biện Chứng (Tarot Core Heuristic Engine)**:
              + Thuật toán Lá Bài Cốt Tủy (The Quintessence Card) tìm bài học linh hồn cốt lõi.
              + Bộ tạo mạch truyện biện chứng nhân quả liên hoàn kết hợp ma trận Golden Dawn Elemental Dignities.
              + Nhận diện các tổ hợp cổ mẫu đặc thù (Mẫu Hoàng gia, Đơn sắc, Cặp bài chuyển hóa).
            - **Tối Ưu Hóa Giao Diện Báo Cáo Phân Tầng Chuyên Sâu**:
              + Trình bày trang trọng: *Lá Bài Cốt Tủy $\rightarrow$ Tổng Luận Mạch Truyện Biện Chứng $\rightarrow$ Mẫu Hình Cổ Mẫu $\rightarrow$ Phân Tích Vĩ Mô & Ma Trận Nguyên Tố $\rightarrow$ Chi Tiết Từng Lá $\rightarrow$ Lời Khuyên Hành Động*.
              + Cuộn cảm ứng di động mượt mà 60 FPS, hỗ trợ giao diện Sáng & Tối hoàn hảo.
              + Bổ sung cơ chế `overflow-y: auto !important`, `-webkit-overflow-scrolling: touch` và `touch-action: pan-y` cho container giao diện Tarot.
              + Cho phép vuốt cuộn mượt mà 60 FPS từ trên xuống dưới và từ dưới lên trên, không còn bị khựng hay kẹt màn hình.
            - **Tối Ưu Hóa Bố Cục Bàn Bài Tarot Trên Mobile**:
              + Tinh chỉnh khoảng cách padding, đưa thanh tab `[Trải Bài] [Bách Khoa] [Nhật Ký]` lên cùng 1 hàng cuộn ngang gọn gàng.
              + Cả 3 lá bài trải ra hiển thị vừa vặn, trọn vẹn và cân đối trên màn hình điện thoại mà không bị cắt nửa chừng.
              + Bổ sung tính năng tự động cuộn mượt mà (`smooth scrollIntoView`) tới bàn bài và báo cáo khi bốc bài.
              + Tích hợp đầy đủ CSDL tri thức 78 lá bài (22 Major Arcana + 56 Minor Arcana: Cốc, Tiền, Kiếm, Gậy).
              + Áp dụng Thuật toán Tương tác Nguyên tố Cổ điển **Golden Dawn Elemental Dignities**: Đánh giá định lượng tương sinh (+1.5), đồng dạng (+1.0), tương khắc (-1.0) và trung tính (+0.5).
              + **Phân tích Định lượng Vĩ mô (Macro Scan)**: Tỷ lệ Ẩn chính (Định mệnh vs Ý chí tự do), Tỷ lệ Chiều bài (Xuôi / Ngược), Phân bổ 4 Nguyên tố (Lửa, Nước, Khí, Đất) và Dòng chảy năng lượng tổng thể.
            - **Trải Nghiệm Bàn Bài 3D & Lật Bài Chân Thực (Interactive 3D Flip)**:
              + Bốc bài ngẫu nhiên theo xác suất tự nhiên (75% xuôi, 25% ngược).
              + Hiệu ứng lật bài 3D mượt mà xoay ngang `rotateY(180deg)` giữ nguyên chiều bài RWS, tự động định vị thẻ ngược.
              + Đa dạng kiểu trải bài: 3 lá Quá khứ - Hiện tại - Tương lai, Vấn đề & Giải pháp, Mối quan hệ, Quyết định A/B, và 1 lá Daily Card.
            - **Bách Khoa Toàn Thư 78 Lá Bài (Tarot Encyclopedia)**:
              + Tra cứu toàn bộ 78 lá bài với bộ lọc Ẩn chính, Cốc, Tiền, Kiếm, Gậy và tìm kiếm thông minh.
              + Popup chi tiết: Ảnh HD, từ khóa Xuôi/Ngược, ý nghĩa Tổng quan, Công việc, Tình cảm và Lời khuyên hành động.
            - **Nhật Ký Trải Bài Cục Bộ (Tarot Journal)**:
              + Lưu trữ chiêm nghiệm bảo mật 100% trên thiết bị, xem lại lịch sử chi tiết mọi lúc không cần mạng.
            - **Hoàn toàn Ngoại tuyến 100% Offline (Zero-AI, Zero-API, Zero-Cost)**: Khởi động tức thì, bảo mật tuyệt đối.
