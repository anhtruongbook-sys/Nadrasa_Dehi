name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APKs
        working-directory: ./mobile_app
        run: |
          mkdir -p ../build-output
          
          # 1. Build Split-per-ABI (creates lightweight ~40MB APKs for ARM64 & ARMv7)
          echo "=== Building Split-per-ABI APKs ==="
          flutter build apk --release --split-per-abi --android-skip-build-dependency-validation
          
          if [ -f build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk ../build-output/NetaLight-arm64.apk
          fi
          if [ -f build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk ../build-output/NetaLight-armeabi-v7a.apk
          fi
          
          # 2. Build Universal Fat APK (contains all ABIs in one file)
          echo "=== Building Universal Fat APK ==="
          flutter build apk --release --android-skip-build-dependency-validation
          
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            cp build/app/outputs/flutter-apk/app-release.apk ../build-output/NetaLight.apk
          fi
          
          ls -lh ../build-output/

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v2.8.30
          name: "Neta Light v2.8.30 (Đa Nhân Chiêm Can Năm Sinh & Luận Giải Đa Tầng Kỳ Môn Độn Giáp)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v2.8.30
            - **Hỗ Trợ Đa Nhân Chiêm Trong 1 Canh Giờ (Can Năm Sinh / Niên Can Bản Mệnh)**:
              + Bổ sung chế độ chọn Dụng Thần Người Hỏi: Chuyển đổi linh hoạt giữa `[⏰ Can Giờ/Ngày]` mặc định và `[🎂 Can Năm Sinh]`.
              + Tự động quy đổi năm sinh (1940 - 2026) sang Can Chi và Dụng Thần Thiên Can tương ứng (với Giáp quy về Mậu hoặc Cung Trực Phù).
              + Hỗ trợ chọn nhanh trực tiếp 10 Thiên Can bản mệnh để định vị Cung Chủ Thể không bị trùng lặp khi nhiều người cùng hỏi trong 1 thời điểm.
            - **Nâng Cấp Động Cơ Luận Giải Chuyên Sâu Đa Tầng (Multi-Layer Divination Synthesis)**:
              + Tầng 1: Tương quan Chủ - Khách & Ngũ Hành Sinh Khắc (Sinh Nhập, Khắc Nhập, Tỷ Hòa, Sinh Xuất, Khắc Xuất) cùng điểm số định lượng 0-100đ.
              + Tầng 2: Bóc tách Bộ Tứ Kỳ Môn tại Cung Sự Việc (Bát Môn, Cửu Tinh, Thần Trợ, Phối Cách Thập Can với 17 cách cục kinh điển như Thanh Long Phản Thủ, Thái Bạch Nhập Huỳnh, v.v.).
              + Tầng 3: Nhận diện Trạng thái Đặc biệt - Tuần Không (Khí số suy giảm 70-80%) & Biến Động Dịch Mã (Tốc độ chuyển biến nhanh, xuất hành).
              + Tầng 4: Sách Lược Hành Động & Ứng Kỳ Dự Báo - Chỉ định chiến lược (Tấn Công / Phòng Thủ), Phương vị đón Cát Khí và Thời điểm ứng nghiệm theo Địa Chi.
            - **Đồng Nhất Giao Diện Sáng / Tối (WCAG AAA)**:
              + Hoàn thiện độ tương phản chuẩn mực cho thẻ Chiêm đoán trên cả hai chế độ nền Sáng và Tối.
              + **Chế Độ Tọa Thiền Định Tâm & Nhịp Thở Khí Công 4-7-8**: Đồng hồ nhịp thở động (Hít 4s - Nín 7s - Thở 8s) đưa sóng não về tầng Alpha/Theta (7-14 Hz), kết nối trường năng lượng Thần bảo hộ với tư thế Tọa Lưng (Back-To).
              + **Kỳ Môn Bản Mệnh Kết Nối Thần Vũ Trụ**: Tích hợp từ điển tiềm thức, bản chất tâm thức, bẫy tâm lý và thần chú kích hoạt năng lượng trọn đời.
              + Khắc phục hoàn toàn hiện tượng bản đồ đứng yên khi xoay điện thoại ở chế độ la bàn thực địa (`🧭 Đang Đọc`).
              + Toàn bộ bản đồ ảnh vệ tinh & đường phố xoay mượt mà 360 độ theo thời gian thực trùng khớp với góc nhìn thực tế của người dùng (12h là hướng trước mặt).
              + Kết cấu khung hiển thị Oversized 160vmax triệt tiêu 100% hiện tượng hở góc trắng/đen khi xoay bản đồ ở bất kỳ góc độ nào.
              + Tích hợp nút tùy chọn chế độ Xoay theo La Bàn (Heading-Up) hoặc Khóa Hướng Bắc (North-Up) trong Bảng điều khiển công cụ.
            - **Nâng Cấp Lớp Bản Đồ: Thay OpenStreetMap bằng Google Maps Đường Phố**:
              + Tích hợp đầy đủ lớp Google Maps Roadmap chính thức (`lyrs=m`), hiển thị tên đường sá, địa danh, số nhà tiếng Việt chuẩn xác và sắc nét tương tự Google Maps và các ứng dụng la bàn chuyên nghiệp.
              + Bộ chuyển đổi 3 lớp linh hoạt: Vệ Tinh Google Earth (`lyrs=y`), Vệ Tinh Esri World Imagery, và Google Maps Đường Phố (`lyrs=m`).
            - **Tối Ưu Hóa Giao Diện Lục Nhâm Đại Độn**:
              + **Hợp Nhất Thẻ Tổng Quan Thần Khóa**: Loại bỏ nút chuyển 8 lớp/1 chạm rời rạc và ô ngày giờ tiết khí bị ngắt dòng lộn xộn, tích hợp thành một thẻ Master Card thống nhất, sang trọng.
              + **Bộ Nút Chuyển Chế Độ Đồng Bộ (8 Lớp / 1 Chạm)**: Đặt gọn gàng ngay tại tiêu đề Thần Khóa ở trên đỉnh và đồng bộ trực tiếp tại thanh tiêu đề Bàn Cờ 12 Cung bên dưới.
              + **Ma Trận Tọa Độ 2x3 Cân Đối (2 Hàng x 3 Cột)**: Hiển thị 6 thông số cốt tử của quẻ Lục Nhâm (NGÀY, GIỜ, QUÝ NHÂN, NGUYỆT TƯỚNG, BẢN MỆNH, HÀNH NIÊN) vuông vức, đối xứng, không còn hiện tượng rớt dòng hay dấu chấm lửng thừa.
            - **Hệ Thống La Kinh Vệ Tinh Siêu Tối Giản**:
              + Tối giản toàn diện bản đồ vệ tinh, loại bỏ nút nổi dư thừa và vòng tròn mờ GPS.
            - **Tính Năng Chuyên Sâu: Tra Cứu Trùng Tang - Nhập Mộ - Thiên Di (Âm Trạch)**:
              + Bấm quẻ tay 12 cung Địa Chi kinh điển: Nam khởi 10 tuổi tại Dần (thuận chiều), Nữ khởi 10 tuổi tại Thân (nghịch chiều).
              + Bóc tách trọn vẹn 4 Trụ lâm chung: Trụ Năm (Tuổi thọ), Trụ Tháng (Tháng mất ÂL), Trụ Ngày (Ngày mất ÂL), Trụ Giờ (Giờ mất Can Chi).
              + Phân loại Tứ Sinh (Dần/Thân/Tị/Hợi = Trùng Tang ⚠️), Tứ Mộ (Thìn/Tuất/Sửu/Mùi = Nhập Mộ 🌸), Tứ Chính (Tý/Ngọ/Mão/Dậu = Thiên Di ☁️).
              + Luận giải phong thủy chính thống: *"Nhập Mộ thắng Trùng Tang"* (chỉ cần có 1 Nhập Mộ là đại cát, mồ yên mả đẹp).
              + Cung cấp hướng dẫn tâm linh đạo Phật chuẩn mực: tụng kinh siêu độ, quy y Tam Bảo, làm thiện hồi hướng, tránh hoang mang mê tín dị đoan làm tổn hao tài lực gia đình.
              + Tự động tích hợp trực quan khi chọn mục việc Tang lễ / An táng, hỗ trợ tùy biến Năm mất, Tháng mất, Ngày mất, Giờ mất tương tác thời gian thực.
            - **Chuẩn Hóa Phân Định Tuổi & Nghi Thức Âm Trạch Tang Lễ**:
              + Tự động nhận diện mục việc Tang lễ để chuyển nhãn thành: `Năm sinh Người Mất / Âm trạch (Dương lịch)` và hiển thị Hưởng thọ.
              + Bổ sung tra cứu Bản Mệnh Ngũ Hành Nạp Âm Lục Thập Hoa Giáp (Ví dụ: Giáp Thân - Tuyền Trung Thủy).
              + **ẨN HOÀN TOÀN hạn Kim Lâu và Hoang Ốc** khi xem Tang lễ / Chôn cất (Hoang Ốc chỉ dùng cho làm nhà dương trạch, cưới hỏi chỉ dùng cho cô dâu; tang lễ tuyệt đối không áp dụng).
              + Thay thế bằng cảnh báo âm trạch chuẩn mực: Tránh ngày Trực Xung Địa Chi & Bản Mệnh của Người Mất, kiêng ngày Trùng Tang/Tam Tang/Sát Chủ Âm Phần, kiêng ngày xung tuổi Trưởng nam (Chủ tang).
              + Chuyển đổi nhãn Tọa Sơn tương ứng: `Tọa Sơn Mộ Phần / Huyệt Mộ (Âm Trạch - Phối La Kinh)`.
            - **Phân Định Tuổi Thông Minh Theo Mục Việc**:
              + Nhóm Hôn nhân: Tính Kim Lâu cô dâu, ẩn Hoang Ốc làm nhà.
              + Nhóm Xây dựng / Dương trạch: Tính đầy đủ Tam Tai, Kim Lâu, Hoang Ốc và Tọa Sơn Nhà.
            - **Cụm Chọn Giới Tính Nam/Nữ & Cung Phi Bát Trạch**: Đồng bộ 100% trên toàn ứng dụng.
            - **Đồng Nhất Giao Diện Chọn Trường Phái Trạch Cát**:
              + Gỡ bỏ khung viền thừa thãi bao quanh ô chọn `☯ Huyền Không Đại Quái` và `🔮 Kỳ Môn Chiến Lược & Tác Quyết`.
            - **Khắc Phục Hoàn Toàn Lỗi Module Bị Đẩy Xuống Dưới Không Dùng Được**:
              + Bổ sung giới hạn chiều cao tối đa thích ứng màn hình `max-height: calc(100dvh - 65px)` cho menu danh mục phân hệ `.deck-dropdown-menu`.
              + Kích hoạt cuộn mượt độc lập `overflow-y: auto`, `-webkit-overflow-scrolling: touch`, `overscroll-behavior: contain`.
              + Bổ sung khoảng đệm an toàn `padding-bottom: calc(var(--safe-bottom, 12px) + 24px)` chống bị che khuất bởi thanh điều hướng Home của Android/iOS.
              + Tinh chỉnh khoảng cách dọc giữa các danh mục giúp vừa vặn tầm mắt và chạm chọn dễ dàng 100% cho mọi phân hệ, đặc biệt là `Bốc Quẻ Dịch Lý (Lục Hào & Mai Hoa)`.
            - **Khắc Phục Hoàn Toàn Lỗi Tràn Nút Luận Giải Sang Phải (Tử Vi Đẩu Số)**:
              + Bảng điều khiển UCC Hàng 4 trên màn hình di động hẹp (≤ 390px) tự động rút gọn nhãn hiển thị thông minh (`📜 Cung`, `📖 Luận`) thông qua `.ucc-txt-long` và `.ucc-txt-short`.
              + Tối ưu thanh Pill `[🏛️ 4x4 | 📜 Cung | 📖 Luận]` với `flex: 1 1 0%`, triệt tiêu 100% hiện tượng tràn lề hoặc va chạm đè lên nút `🔮 Lập Lá Số`.
            - **Sửa Triệt Để Lỗi Không Lưu Được Ảnh & Chụp Màn Hình (Canvas Clamping & Stream Engine)**:
              + Sửa lỗi định danh DOM selector (`#view-tuvi`, `#view-bazi`, `#view-qmdj`, `#view-calendar` thay vì tên cũ), khắc phục lỗi chỉ chụp được 1 trang đầu hoặc tràn canvas.
              + Bổ sung cơ chế Canvas Clamping phần cứng di động: Tự động điều chỉnh tỷ lệ `scale` và khống chế chiều cao an toàn tối đa 12.000px, chống tràn bộ nhớ GPU (Texture OOM) và lỗi trả về canvas rỗng (`data:,`).
              + Kiến trúc truyền tệp NativeBridge Streaming chống sập bộ đệm Android Binder IPC (1MB limit): Tách gói dữ liệu ảnh theo block 250KB và ghi tệp tạm bộ nhớ đệm trước khi stream trực tiếp qua MediaStore buffer 64KB, đảm bảo lưu ảnh vào Bộ sưu tập máy 100% trơn tru không lỗi.
            - **Nâng Cấp Kích Thước Chữ & Độ Nét Bàn Lá Số Tử Vi 4x4**:
              + Tăng kích thước phông chữ Chính Tinh, Phụ Tinh, Can Chi, Tràng Sinh, Đại Hạn và các hàng thông tin Thiên Bàn thêm 15% - 25% giúp đọc rõ nét, dễ nhìn trên mọi dòng điện thoại.
            - **Sửa Lỗi Chụp Ảnh Màn Hình Chuyên Sâu (Full-Page Screenshot Capture)**:
              + Bổ sung phân hệ Lục Nhâm (`lucnham`) và Thái Ất (`thaiat`) vào hệ thống điều phối `captureArenaScreenshot` trong `app.js`.
              + Tự động tính toán chiều cao toàn phần `captureHeight` (2.500px - 20.000px+) cho cả tab Bàn Quẻ và Luận Giải.
              + Khắc phục triệt để cơ chế CSS `height: 100% !important`, `overflow-y: auto !important` và `contain: content` trong `sanitizeClone`, cho phép `html2canvas` chụp trọn vẹn 100% nội dung từ đầu đến cuối không bị cắt cụt ở trang đầu tiên.
            - **Nâng Cấp Kích Thước Chữ & Trải Nghiệm Đọc Trên Điện Thoại Di Động (Mobile Typography)**:
              + Nâng kích thước tiêu đề đề mục Accordion lên 14.5px (font-weight 800) với khoảng đệm ngón tay 10x12px.
              + Nâng kích thước nội dung Luận Giải lên 13.5px với chiều cao dòng thoáng đạt (line-height 1.65).
              + Nâng kích thước nhãn chỉ số, thanh Subbar, nút lọc Pills và bảng toán Thái Ất lên 12px - 13px sắc nét.
              + Nâng cấp độ tương phản cho tiêu đề Meta Bar trên nền sáng (#92400e) đảm bảo chuẩn tiếp cận WCAG AA.
            - **Loại Bỏ Hoàn Toàn Nút Luận Giải Trùng Lặp**:
              + Gỡ bỏ banner card `.lucnham-luan-banner` và `.thaiat-luan-banner` choán diện tích giữa màn hình. Chức năng xem luận giải được tích hợp hoàn toàn vào tab `[ 🏛️ Bàn Quẻ | 📜 Luận Giải ]` ở Hàng 4 của Bảng điều khiển UCC.
            - **Sửa Lỗi Triệt Để Nút ✕ Đóng Bảng Tra Cứu (Palace Drawer)**:
              + Nâng kích thước touch target của nút ✕ lên chuẩn mực di động 44x44px.
              + Bổ sung đầy đủ sự kiện `click` và `touchend` cho nút ✕ và lớp phủ overlay `#lucnham-drawer-overlay`.
              + Export chính thức hàm `closeDrawer` và `openDrawer` trên `global.LucNhamView`.
            - **Bổ Sung Đầy Đủ Thành Phần Lập Quẻ Lục Nhâm Cốt Lõi**:
              + Ô nhập Năm Sinh đương số (`lucnham-input-birthyear`) kèm huy hiệu tính toán tự động Can Chi Năm sinh và Tuổi Âm (ví dụ: `Canh Ngọ • 37T`, `Ất Sửu • 42T`).
              + Tính toán ĐỘNG Bản Mệnh (Địa Chi năm sinh) và Hành Niên (Nam khởi Dần thuận, Nữ khởi Thân nghịch).
              + Hiển thị trực quan Bản Mệnh và Hành Niên trên Master Strip, Center HUD và đánh dấu trực tiếp tag `Mệnh`, `Niên` trên 12 cung Địa bàn.
              + Bộ chuyển đổi Quý Nhân Đán / Mộ tương tác `[ ☀️ Đán | 🌙 Mộ ]` (tự động theo giờ hoặc chủ động chỉ định).
            - **Đồng Bộ Lịch Pháp Chuẩn Xác 100% Theo NetaCalendarEngine**:
              + Bắt buộc tính Can Chi Ngày, Giờ, Tháng, Năm, Tiết Khí (Thu Phân) trực tiếp từ động cơ lịch pháp gốc của app.
            - **Tối Ưu Hóa Độ Tương Phản Giao Diện Sáng (Light Mode WCAG AA)**:
              + Khắc phục hoàn toàn lỗi chữ trắng chìm trên nền sáng trong Drawer, thẻ Tam Truyền, Center HUD và các tag trạng thái.
            - **Chuẩn Hóa & Nâng Cấp Độ Tương Phản Giao Diện Sáng (Light Mode WCAG AA)**:
              + Tối ưu độ đậm nét và tương phản cho dải thông tin Ribbon (Độn, Cục, Nguyên, Kỷ Dư, Tiết khí), triệt tiêu hoàn toàn lỗi rớt chấm bullet lẻ hàng.
              + Cung cấp viền và màu số sắc nét cho trọng số 16 cung Thái Ất, tên cung Hoàng Gia hổ phách đậm `#78350f`, nút lọc 5 tầng dữ liệu và số Toán Chủ/Khách/Định.
              + Cải thiện độ tương phản cho 8 lớp thông tin Lục Nhâm Đại Độn.
              + CSDL 100 Điệu Tất Pháp Phú của Thiệu Ngạn Hòa nguyên bản Hán tự & chỉ dẫn hành động.
              + Cẩm nang 8 Sự Vụ Đời Sống Thực Tiễn Hàng Ngày (Nhà đất, Hợp đồng, Xin việc, Vay vốn, Giao tế, Khám bệnh, Tình cảm, Mất đồ, Xuất hành, Khiếu nại).
              + Modal Drawer toàn màn hình với Dashboard 3 chỉ số định lượng (Điểm Rủi Ro 1-5 Sao, Trục Thể - Dụng, Sách Lược), 5 Filter Pills, tương tác Accordion và Theme Parity hoàn hảo Light/Dark Mode.
              + Rào chắn kiểm định 4 lớp chống ảo giác và tích hợp AI Gemini biên tập luồng kép.
            - **Tích Hợp Toàn Diện Động Cơ Luận Giải Chuyên Sâu Thái Ất Thần Kinh (`NetaThaiAtInterpreter`)**:
              + Tự động tính toán và đối sánh 15 phân hệ luận giải Thái Ất chuẩn văn bản cổ điển 100% Offline.
              + Bảng chỉ số định lượng trực quan: Điểm Cát Khánh (0-100), Nguy cơ Xung Đột, Nguy cơ Môi Trường Thiên Tai, Tương Quan Lực Lượng Chủ - Khách.
              + 10 Đại Cách Cục Thái Ất & Cửu Tinh Tuần Hành.
