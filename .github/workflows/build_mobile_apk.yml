name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.4
          name: "Neta Light & Huyền Học v1.3.4 (Tối Ưu Hóa Huy Hiệu Thân, Tuần, Triệt & Không Chồng Lấn)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.4
            - **Tối Ưu Hóa Huy Hiệu Thân, Tuần, Triệt (Zero Badge Overlap)**:
              + **Hợp nhất nhóm huy hiệu**: Đưa `THÂN`, `TRIỆT`, `TUẦN` vào chung flex-container chuyên biệt, hiển thị song song cạnh nhau, loại bỏ hoàn toàn lỗi đè chồng lên nhau khi cung có cả Thân và Tuần/Triệt.
              + **Phân biệt màu sắc & thứ bậc chuẩn xác**:
                * Huy hiệu `THÂN`: Màu Vàng Hổ Phách cao quý (`#d97706` trong Light, `#eab308` chữ đen trong Dark).
                * Huy hiệu `TRIỆT`: Màu Đỏ Thắm (`#dc2626`).
                * Huy hiệu `TUẦN`: Màu Xanh Lục Bảo (`#16a34a`).
              + **Chống cắt cụt tên cung dài**: Tinh chỉnh font tiêu đề cung `0.50rem`, khoảng cách chữ chuẩn xác, hiển thị đầy đủ tên các cung dài như `PHÚC ĐỨC`, `ĐIỀN TRẠCH` dù đi kèm đồng thời cả 2 huy hiệu.
            - **Giao Diện Phẳng Hoàn Toàn & Tương Phản Tối Đa**:
              + Chế độ Sáng: Tiêu đề đen tuyền, Thiên Bàn rõ nét 100%, phụ tinh cát/sát sắc sảo.
              + Chế độ Tối: Nền phẳng dịu mắt, tương phản cao.
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

