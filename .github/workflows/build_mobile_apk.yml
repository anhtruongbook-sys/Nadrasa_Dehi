name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.5
          name: "Neta Light & Huyền Học v1.3.5 (Loại Bỏ Hoàn Toàn Cắt Chữ & Chống Tràn Nút Huy Hiệu)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.5
            - **Khắc Phục Triệt Để Cắt Chữ Khi Không Gian Còn Rộng (Zero Word Truncation)**:
              + **Phụ Tinh (Cát / Sát)**: Chuyển cấu trúc 2 cột phụ tinh sang Flexbox tự co giãn linh hoạt (`display: flex; justify-content: space-between`), loại bỏ khóa cứng 50% và `overflow: hidden`, giúp hiển thị nguyên vẹn 100% tên sao dài (*Thiếu Dương*, *Thanh Long*, *Nguyệt Đức*...).
              + **Thiên Bàn Trung Tâm**: Phân bổ tỉ lệ độ rộng cột thông minh (Cột phải chứa Nạp Âm dài được tăng thêm 35% diện tích), hiển thị đầy đủ không sót chữ nào (*Thiên Thượng Hỏa*, *Hỏa Lục Cục*...).
            - **Loại Bỏ Hoàn Toàn Lỗi Tràn Nút Huy Hiệu (Zero Badge Overflow)**:
              + Hợp nhất `THÂN`, `TRIỆT`, `TUẦN` vào chung một flex-container chuyên biệt, nằm gọn gàng bên phải tiêu đề cung.
              + Cung `PHÚC ĐỨC`, `ĐIỀN TRẠCH` khi có cả Thân và Tuần/Triệt hiển thị 2 huy hiệu độc lập song song, màu sắc phân biệt rõ ràng (Thân: Vàng Hổ Phách, Tuần: Xanh Lục, Triệt: Đỏ Thắm), tuyệt đối không tràn mép ô.
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

