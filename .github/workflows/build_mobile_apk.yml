name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.1.4
          name: "Neta Light & Poker v1.1.4 (Xóa Triệt Để Cache Cũ & Đồng Bộ Toàn Diện)"
          body: |
            ## Ứng dụng Di Động Neta Light & Poker v1.1.4 (Bản Cập Nhật Mới Nhất)
            - **Xóa Triệt Để Cache Trình Duyệt & Service Worker (v7.0)**:
              + Tự động xóa sạch toàn bộ các bộ nhớ đệm cũ (CacheStorage) khi mở ứng dụng.
              + Cài đặt tham số chống cache tĩnh `?v=7.0` cho toàn bộ CSS, JS, Service Worker.
            - **Khôi Phục Căn Giữa Bàn Bài Sang Trọng**:
              + Bàn bài được căn giữa tự nhiên (`justify-content: center; align-content: center`), hài hòa và trang nghiêm.
            - **Header Siêu Gọn (~36px)**:
              + Thu gọn sát mép trên màn hình, triệt tiêu khoảng trống thừa phía trên các icon.
            - **Thu Bài 1 Chạm Tức Thì (Không Hộp Thoại)**:
              + Nút `[🔄 Thu bài]` ở góc trái dọn bàn ngay tức thì trong 0ms.
            - **Hoạt động Ngoại tuyến 100% Offline**: Độc lập hoàn toàn, không cần kết nối mạng.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

