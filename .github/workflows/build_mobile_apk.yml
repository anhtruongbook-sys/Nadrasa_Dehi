name: Build Flutter Mobile Client (APK)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Dart Environment
        run: |
          flutter --version
          dart --version

      - name: Install Flutter Dependencies
        working-directory: ./mobile_app
        run: flutter pub get

      - name: Build Android Release APK
        working-directory: ./mobile_app
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Prepare Single APK
        run: |
          mkdir -p build-output
          if [ -f mobile_app/build/app/outputs/flutter-apk/app-release.apk ]; then
            cp mobile_app/build/app/outputs/flutter-apk/app-release.apk build-output/NetaLight.apk
          else
            cp mobile_app/build/app/outputs/flutter-apk/*.apk build-output/NetaLight.apk
          fi

      - name: Upload Release APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-mobile-release-apk
          path: build-output/NetaLight.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.3.6
          name: "Neta Light & Huyền Học v1.3.6 (Sửa Triệt Để Lỗi Tràn Nút Lịch & Cắt Chữ Tử Vi)"
          body: |
            ## Ứng dụng Di Động Neta Light & Huyền Học v1.3.6
            - **Sửa Triệt Để Lỗi Nút Bị Tràn Ra Ngoài Khung (Lịch Âm Dương)**:
              + Tái cơ cấu thanh điều khiển Lịch 2 tầng chuẩn mực:
                * Tầng 1: Nhóm chọn chế độ (`Tháng / Ngày`), chọn lịch (`Dương / Âm`) và nút `⚡ Hôm nay`.
                * Tầng 2: Hộp nhập ngày tháng năm linh hoạt + Nút hành động `🚀 Xem`.
              + Chấm dứt hoàn toàn hiện tượng nút `[ 🚀 ]` bị đẩy tràn ra khỏi mép khung trên màn hình điện thoại.
            - **Khắc Phục Triệt Để Cắt Chữ Khi Không Gian Còn Rộng (Lá Số Tử Vi)**:
              + **Phụ Tinh (Cát / Sát)**: Chuyển sang Flexbox tự co giãn linh hoạt, loại bỏ khóa cứng 50% và `overflow: hidden`, hiển thị nguyên vẹn 100% tên sao dài (*Thiếu Dương*, *Thanh Long*, *Nguyệt Đức*...).
              + **Thiên Bàn Trung Tâm**: Phân bổ độ rộng cột linh hoạt (tăng 35% không gian cột phải), hiển thị trọn vẹn Nạp Âm (*Thiên Thượng Hỏa*).
              + **Huy Hiệu Cung**: Hợp nhất `THÂN`, `TRIỆT`, `TUẦN` vào chung flex-container, hiển thị song song không đè chồng, không cắt chữ cung dài (*PHÚC ĐỨC*).
            - **Hoạt động Ngoại tuyến 100% Offline độc lập**: 60 FPS mượt mà.
          files: build-output/NetaLight.apk
          draft: false
          prerelease: false

