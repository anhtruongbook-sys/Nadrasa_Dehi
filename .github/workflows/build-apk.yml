name: Build & Release Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Web Assets to Android Project
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp styles.css android/app/src/main/assets/www/
          cp app.js android/app/src/main/assets/www/
          cp cards_data.js android/app/src/main/assets/www/
          cp poker_data.js android/app/src/main/assets/www/
          cp -r icons android/app/src/main/assets/www/
          cp -r neta_cards android/app/src/main/assets/www/
          cp -r Porker android/app/src/main/assets/www/
          chmod +x android/gradlew

      - name: Build Android APK with Gradle
        run: |
          cd android
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifact
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/release/app-release.apk build-output/NetaLight-NadrasaDehi.apk || cp android/app/build/outputs/apk/debug/app-debug.apk build-output/NetaLight-NadrasaDehi.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetaLight-NadrasaDehi-APK
          path: build-output/NetaLight-NadrasaDehi.apk
          retention-days: 30

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/main')
        with:
          tag_name: v1.0.0
          name: "Neta Light & Poker v1.0.0 (Android APK)"
          body: |
            ## 🪷 Neta Light & Bài Tây Poker - Pháp môn Nadrasa Dehi
            
            Ứng dụng chiêm nghiệm tâm linh Nadrasa Dehi và Bài Tây 52 Lá phiên bản cài đặt trực tiếp trên Android (APK):
            
            ### ✨ Tính Năng Nổi Bật:
            - **100% Hoạt động Offline**: Toàn bộ hình ảnh, âm thanh chuông và ý nghĩa quân bài được đóng gói trực tiếp trong app, mở lên dùng ngay không cần kết nối mạng.
            - **Chuyển đổi 2 chế độ bài**: Neta Light (48 lá) và Bài Tây Poker (52 lá).
            - **Thuật toán bốc bài**: Rút 1 lá, 3 lá, 9 lá / 10 lá và rút thêm từng lá linh hoạt.
            - **Tự động co giãn màn hình**: Tối đa 3 lá/hàng, vừa khít 1 màn hình di động không cần cuộn.
            - **Luận giải tâm linh chuẩn xác 100%**: Theo đúng tệp gốc *Ý nghĩa quân bài_1.pdf*.
            
            ### 📲 Hướng Dẫn Cài Đặt:
            1. Tải tệp `NetaLight-NadrasaDehi.apk` bên dưới về điện thoại Android.
            2. Mở tệp vừa tải và chọn **Cài đặt (Install)**.
            3. Nếu điện thoại hỏi quyền *"Cài đặt ứng dụng từ nguồn không xác định"*, bấm **Cho phép (Allow)**.
          files: build-output/NetaLight-NadrasaDehi.apk
          draft: false
          prerelease: false
